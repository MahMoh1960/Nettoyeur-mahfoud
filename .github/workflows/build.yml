name: Construire l'APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4

      - name: Installer Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Installer le SDK Android
        uses: android-actions/setup-android@v3

      - name: Installer Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Assembler le projet Android à partir des fichiers à plat
        run: |
          set -e
          mkdir -p proj/app/src/main/java/app/nettoyage proj/app/src/main/res/drawable
          cp *.java proj/app/src/main/java/app/nettoyage/
          cp AndroidManifest.xml proj/app/src/main/AndroidManifest.xml
          cp ic_launcher.xml proj/app/src/main/res/drawable/ic_launcher.xml
          cat > proj/settings.gradle <<'EOT'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = 'Nettoyage'
          include ':app'
          EOT
          cat > proj/build.gradle <<'EOT'
          plugins {
              id 'com.android.application' version '8.5.2' apply false
          }
          EOT
          cat > proj/gradle.properties <<'EOT'
          org.gradle.jvmargs=-Xmx2g
          android.nonTransitiveRClass=true
          EOT
          cat > proj/app/build.gradle <<'EOT'
          plugins {
              id 'com.android.application'
          }
          android {
              namespace 'app.nettoyage'
              compileSdk 34
              defaultConfig {
                  applicationId 'app.nettoyage'
                  minSdk 24
                  targetSdk 34
                  versionCode 1
                  versionName '1.0'
              }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
          }
          EOT

      - name: Compiler l'APK
        working-directory: proj
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Publier l'APK
        uses: actions/upload-artifact@v4
        with:
          name: Nettoyage-Telephone-APK
          path: proj/app/build/outputs/apk/debug/app-debug.apk
